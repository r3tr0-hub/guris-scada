name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scada-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-ui:
    name: Native tests and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: Build backend and run Python and C suites
        run: sh build_linux_test.sh
      - name: Install UI test dependencies
        run: npm ci --prefix tests
      - name: Test DOM and CSS
        run: npm test --prefix tests
      - name: Install Chromium
        run: npm exec --prefix tests -- playwright install --with-deps chromium
      - name: Test current engineering interface in Chromium
        env:
          SCADA_QA_DIR: ${{ runner.temp }}/scada-ui-qa
        run: python3 tests/run_browser.py test_release24_browser.cjs
      - name: Test diagnostic archive downloads in Chromium
        env:
          SCADA_QA_DIR: ${{ runner.temp }}/scada-ui-qa
        run: python3 tests/run_browser.py test_diagnostics_browser.cjs

  windows:
    name: Windows x64 build
    needs: native-and-ui
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/Push-GitHub.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Install Zig 0.13.0
        run: python -m pip install -r requirements-build.txt
      - name: Compile production executable
        run: python tools/build_windows.py
      - name: Package application and refresh diagnostic hashes
        run: python tools/build_release.py
      - name: Keep Windows package
        uses: actions/upload-artifact@v7
        with:
          name: GurisSCADA-Windows-x64-${{ github.sha }}
          path: dist/GurisSCADA_*_Windows_x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
