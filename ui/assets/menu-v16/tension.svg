<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" class="guris-icon" role="img" aria-labelledby="title-tn desc-tn">
<title id="title-tn">Натяжение</title>
<desc id="desc-tn">Плёнка плавно переходит из провисающей волны в ровную натянутую линию той же толщины, без проявления; ход плёнки справа налево.</desc>
