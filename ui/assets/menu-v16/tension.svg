  <linearGradient id="tn-metal" x1="0" y1="0" x2=".95" y2=".95"><stop stop-color="#ffffff" /><stop offset=".24" stop-color="#d5e7ef" /><stop offset=".43" stop-color="#7693ae" /><stop offset=".66" stop-color="#edf6ff" /><stop offset=".83" stop-color="#7d97ad" /><stop offset="1" stop-color="#e2f3ff" /></linearGradient>
</defs>
<style>
.tn-spin{transform-box:view-box;animation:tn-spin 5.2s linear infinite}
.tn-flow{animation:tn-flow 1.7s linear infinite}
.tn-indicate{animation:tn-indicate 4.3s ease-in-out infinite}
@keyframes tn-spin{to{transform:rotate(-360deg)}}
@keyframes tn-flow{to{stroke-dashoffset:64}}
@keyframes tn-indicate{0%,100%{opacity:.8}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce) { .guris-icon * { animation: none !important; transition: none !important; } }
</style>
